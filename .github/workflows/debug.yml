name: Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build installable Debug APKs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          lfs: false
          persist-credentials: false
      - name: Restore bundled toolchain LFS objects
        id: lfs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .git/lfs/objects
          key: ${{ runner.os }}-${{ runner.arch }}-vkyra-lfs-v1-${{ hashFiles('app/src/**/assets/*.tar.xz', 'app/src/main/assets/demo.apk') }}
      - name: Materialize and verify LFS resources
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          git lfs pull
          git lfs fsck
      - name: Save verified toolchain LFS objects
        if: github.ref == 'refs/heads/main' && steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .git/lfs/objects
          key: ${{ steps.lfs-cache.outputs.cache-primary-key }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Locate SDK and cache generation
        id: sdk
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          # Preinstalled root-owned directories prevent tar restoring cache metadata.
          sudo chown -R "$(id -u):$(id -g)" "$sdk_root"
          {
            echo "root=$sdk_root"
            echo "epoch=$(date -u +%Y-%m)"
          } >> "$GITHUB_OUTPUT"
      - name: Restore Android build SDK
        id: sdk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.sdk.outputs.root }}/platform-tools
            ${{ steps.sdk.outputs.root }}/platforms/android-37.0
            ${{ steps.sdk.outputs.root }}/build-tools/36.0.0
            ${{ steps.sdk.outputs.root }}/ndk/28.2.13676358
            ${{ steps.sdk.outputs.root }}/licenses
          key: ${{ runner.os }}-${{ runner.arch }}-vkyra-sdk-v1-${{ steps.sdk.outputs.epoch }}-${{ hashFiles('scripts/ci/install-sdk.sh', 'gradle.properties') }}
      - name: Install the pinned Android SDK and NDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci/install-sdk.sh build
      - name: Save Android build SDK
        if: github.ref == 'refs/heads/main' && steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.sdk.outputs.root }}/platform-tools
            ${{ steps.sdk.outputs.root }}/platforms/android-37.0
            ${{ steps.sdk.outputs.root }}/build-tools/36.0.0
            ${{ steps.sdk.outputs.root }}/ndk/28.2.13676358
            ${{ steps.sdk.outputs.root }}/licenses
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}
      - name: Restore the dedicated development signing key
        env:
          DEBUG_KEYSTORE: ${{ secrets.VKYRA_DEBUG_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PYKEY'
          import base64, os, pathlib
          encoded = os.environ.get('DEBUG_KEYSTORE', '')
          if not encoded:
              raise SystemExit('Configure VKYRA_DEBUG_KEYSTORE_BASE64 for consistent full/Lite updates')
          key = pathlib.Path.home() / '.android/debug.keystore'
          key.parent.mkdir(parents=True, exist_ok=True)
          key.write_bytes(base64.b64decode(encoded, validate=True))
          key.chmod(0o600)
          PYKEY
      - name: Build and validate all four Debug APKs
        run: bash scripts/ci/build-debug.sh
      - name: Upload aarch64 full Debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vkyra-debug-aarch64-full
          path: build/debug-downloads/aarch64-full/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload aarch64 lite Debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vkyra-debug-aarch64-lite
          path: build/debug-downloads/aarch64-lite/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload x86_64 full Debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vkyra-debug-x86_64-full
          path: build/debug-downloads/x86_64-full/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload x86_64 lite Debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vkyra-debug-x86_64-lite
          path: build/debug-downloads/x86_64-lite/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Publish download guide
        run: |
          {
            echo '### Debug APK downloads'
            echo '| Device | First install / toolchain update | App-only update |'
            echo '| --- | --- | --- |'
            echo '| ARM64 phone/tablet | vkyra-debug-aarch64-full | vkyra-debug-aarch64-lite |'
            echo '| x86_64 emulator/device | vkyra-debug-x86_64-full | vkyra-debug-x86_64-lite |'
            echo 'Download only the artifact you need. Each contains one APK, checksums and build metadata.'
            echo 'Lite reuses tools already extracted by Full; install Full first when tools are missing or need an update.'
            echo 'All four APKs share the same development certificate, application ID and dated version.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary development key
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"
