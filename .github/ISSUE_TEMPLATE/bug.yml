name: Bug report / 错误报告
description: Report a reproducible problem / 提供可复现的问题
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Do not include access tokens, signing keys, private source or personal paths in logs/screenshots.
        请先搜索已有问题；日志和截图请去掉令牌、签名密钥、私人源码和个人路径。
        For a security vulnerability, follow SECURITY.md instead of opening a public issue.
  - type: input
    id: version
    attributes:
      label: Vkyra version / 版本
      description: Include versionName, build source (Release/CI/local), and commit when available.
      placeholder: 1.1.2, CI debug, commit abc1234
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and Android / 设备和系统
      placeholder: Pixel 7, Android 14 / API 34, arm64-v8a, no root
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
      description: Include the smallest example project or sanitized input if it helps.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期表现
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际表现
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs and screenshots / 脱敏日志和截图
      description: Include the full relevant compiler error/stack trace, not only its last line.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting / 提交前确认
      options:
        - label: I searched existing issues / 我已搜索已有问题
          required: true
        - label: I removed secrets and private data / 我已去掉敏感信息
          required: true
