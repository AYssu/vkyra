def signingProps = new Properties()
def signingPropsFile = rootProject.file("keystore.properties")
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}

// CI supplies these only in the protected release job. Local signing uses the
// ignored keystore.properties file; never place credentials in Gradle arguments.
def releaseSigning = [
    storeFile: providers.environmentVariable('VKYRA_KEYSTORE_FILE').orElse(signingProps.getProperty('storeFile', '')).get(),
    storePassword: providers.environmentVariable('VKYRA_KEYSTORE_PASSWORD').orElse(signingProps.getProperty('storePassword', '')).get(),
    keyAlias: providers.environmentVariable('VKYRA_KEY_ALIAS').orElse(signingProps.getProperty('keyAlias', '')).get(),
    keyPassword: providers.environmentVariable('VKYRA_KEY_PASSWORD').orElse(signingProps.getProperty('keyPassword', '')).get()
]
def hasReleaseSigning = releaseSigning.values().any { !it.isEmpty() }
if (hasReleaseSigning && releaseSigning.values().any { it.isEmpty() }) {
    throw new GradleException('Release signing is incomplete. Set all four VKYRA signing variables or keystore.properties entries.')
}
if (hasReleaseSigning && !rootProject.file(releaseSigning.storeFile).isFile()) {
    throw new GradleException('Release keystore file does not exist.')
}

abstract class PrepareLegalAssets extends DefaultTask {
    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getLegalFiles()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @Inject
    abstract FileSystemOperations getFileOperations()

    @TaskAction
    void prepare() {
        fileOperations.sync {
            from(legalFiles)
            into(outputDirectory.dir('licenses'))
        }
    }
}

def legalAssets = tasks.register('prepareLegalAssets', PrepareLegalAssets) {
    legalFiles.from(rootProject.file('licenses'), rootProject.files('LICENSE', 'LICENSE.md', 'THIRD_PARTY_NOTICES.md'))
    outputDirectory.set(layout.buildDirectory.dir('generated/legalAssets'))
}

android {
    namespace 'com.vkyra.code'
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion
    compileSdk 37



    defaultConfig {
        applicationId "com.vkyra.code"
        minSdk 26
        // Bundled executables require the existing target-28 execution model.
        targetSdk 28
        versionCode 1000112
        versionName '1.1.2'
        buildConfigField 'String', 'UPDATE_REPOSITORY', '"' + providers.gradleProperty('vkyra.updateRepository').getOrElse('').replace('\\', '\\\\').replace('"', '\\"') + '"'
        
        // 启用 multidex
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    
    // 为不同 ABI 创建 flavor (仅用于区分 clang 工具链)
    flavorDimensions += "abi"
    productFlavors {
        aarch64 {
            dimension "abi"
        }
        x86_64 {
            dimension "abi"
        }
    }
    
    // ABI-specific archives live in their flavor source sets; merge never deletes source assets.
    if (providers.gradleProperty('removeAllArchAssets').getOrElse('false').toBoolean()) {
        sourceSets.configureEach { assets.exclude '**/*.tar.xz' }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            distribution {
                storeFile rootProject.file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true   // Standard AGP R8 only.
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.distribution
        }
        debug {
            minifyEnabled false // Keep debug stack traces and instrumentation readable.
            shrinkResources false
            proguardFiles  'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty "robolectric.dependency.repo.url", "https://repo.maven.apache.org/maven2"
        }
    }
    lint {
        // Explicit project invariant: direct-distribution IDE keeps target 28 so its
        // bundled compiler can execute from filesDir. This is not a Play submission.
        disable 'ExpiredTargetSdkVersion'
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/proguard/androidx-*.pro',
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
            ]
        }
    }
    
    // 禁止 AAPT 压缩某些文件
    androidResources {
        noCompress 'xz', 'tar.xz'
    }

}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets.addGeneratedSourceDirectory(legalAssets) { it.outputDirectory }
    }
    onVariants(selector().withBuildType('release')) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set(output.versionName.map { version ->
                "Vkyra_C_CPP_IDE_${version}_${variant.flavorName}.apk"
            })
        }
    }
}

