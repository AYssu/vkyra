name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate (used by the release workflow)
        required: false
        default: ''
        type: string
      build-date:
        description: Fixed Asia/Shanghai build date for reproducible dated release versions
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host:
    name: Host build, tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VKYRA_CI_EXPECTED_SHA: ${{ inputs.ref || github.sha }}
      ORG_GRADLE_PROJECT_vkyraBuildDate: ${{ inputs.build-date }}
    steps:
      # All actions below are pinned to commits verified against their official tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          lfs: false
          persist-credentials: false
      - name: Restore bundled toolchain LFS objects
        id: lfs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .git/lfs/objects
          key: ${{ runner.os }}-${{ runner.arch }}-vkyra-lfs-v1-${{ hashFiles('app/src/**/assets/*.tar.xz', 'app/src/main/assets/demo.apk') }}
      - name: Materialize and verify LFS resources
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          git lfs pull
          git lfs fsck
      - name: Save verified toolchain LFS objects
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .git/lfs/objects
          key: ${{ steps.lfs-cache.outputs.cache-primary-key }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Check workflow definitions and script syntax
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          for script in scripts/ci/*.sh; do bash -n "$script"; done
          python3 -m compileall -q scripts distribution
      - name: Install the real host language server
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y clangd
          echo "VKYRA_HOST_CLANGD=$(command -v clangd)" >> "$GITHUB_ENV"
      - name: Locate SDK and cache generation
        id: sdk
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          # Preinstalled root-owned directories prevent tar restoring cache metadata.
          sudo chown -R "$(id -u):$(id -g)" "$sdk_root"
          {
            echo "root=$sdk_root"
            echo "epoch=$(date -u +%Y-%m)"
          } >> "$GITHUB_OUTPUT"
      - name: Restore Android build SDK
        id: sdk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.sdk.outputs.root }}/platform-tools
            ${{ steps.sdk.outputs.root }}/platforms/android-37.0
            ${{ steps.sdk.outputs.root }}/build-tools/36.0.0
            ${{ steps.sdk.outputs.root }}/ndk/28.2.13676358
            ${{ steps.sdk.outputs.root }}/licenses
          key: ${{ runner.os }}-${{ runner.arch }}-vkyra-sdk-v1-${{ steps.sdk.outputs.epoch }}-${{ hashFiles('scripts/ci/install-sdk.sh', 'gradle.properties') }}
      - name: Install the pinned Android SDK and NDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci/install-sdk.sh build
      - name: Save Android build SDK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.sdk.outputs.root }}/platform-tools
            ${{ steps.sdk.outputs.root }}/platforms/android-37.0
            ${{ steps.sdk.outputs.root }}/build-tools/36.0.0
            ${{ steps.sdk.outputs.root }}/ndk/28.2.13676358
            ${{ steps.sdk.outputs.root }}/licenses
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}
      - name: Verify source, licenses, JVM tests, lint and both ABI builds
        run: |
          if [[ -z "$ORG_GRADLE_PROJECT_vkyraBuildDate" ]]; then
            ORG_GRADLE_PROJECT_vkyraBuildDate="$(TZ=Asia/Shanghai date +%F)"
          fi
          export ORG_GRADLE_PROJECT_vkyraBuildDate
          bash scripts/ci/verify.sh
      - name: Upload exact device-test inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-test-inputs
          path: build/ci-inputs/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload development builds and host reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vkyra-builds
          path: |
            app/build/outputs/apk/
            app/build/outputs/mapping/
            app/build/reports/
            app/build/test-results/
            terminal-emulator/build/reports/
            terminal-emulator/build/test-results/
            build/ci-evidence/
            build/ci-inputs/manifest.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

  android:
    name: Android API ${{ matrix.api }}
    needs: host
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 30, 37]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
          # Source scripts only: the full LFS payloads are already inside host-built APKs.
          lfs: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-test-inputs
          path: build/ci-inputs
      - name: Locate SDK and cache generation
        id: sdk
        env:
          API: ${{ matrix.api }}
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          sudo chown -R "$(id -u):$(id -g)" "$sdk_root"
          image_api="$API"
          if [[ "$API" == 37 ]]; then image_api=37.0; fi
          {
            echo "root=$sdk_root"
            echo "image_api=$image_api"
            echo "epoch=$(date -u +%Y-%m)"
          } >> "$GITHUB_OUTPUT"
      - name: Restore dedicated emulator SDK
        id: sdk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.sdk.outputs.root }}/platform-tools
            ${{ steps.sdk.outputs.root }}/emulator
            ${{ steps.sdk.outputs.root }}/system-images/android-${{ steps.sdk.outputs.image_api }}/default/x86_64
            ${{ steps.sdk.outputs.root }}/licenses
          key: ${{ runner.os }}-${{ runner.arch }}-vkyra-emulator-${{ matrix.api }}-v1-${{ steps.sdk.outputs.epoch }}-${{ hashFiles('scripts/ci/install-sdk.sh') }}
      - name: Install dedicated emulator image
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci/install-sdk.sh '${{ matrix.api }}'
      - name: Save dedicated emulator SDK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.sdk.outputs.root }}/platform-tools
            ${{ steps.sdk.outputs.root }}/emulator
            ${{ steps.sdk.outputs.root }}/system-images/android-${{ steps.sdk.outputs.image_api }}/default/x86_64
            ${{ steps.sdk.outputs.root }}/licenses
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}
      - name: Full Android regression and real R8 release smoke
        run: bash scripts/ci/run-emulator.sh '${{ matrix.api }}'
      - name: Upload actual device evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-api-${{ matrix.api }}-evidence
          path: |
            build/ci-evidence/*.txt
            build/ci-evidence/*.json
            build/ci-evidence/*.log
          if-no-files-found: warn
          retention-days: 7

  required:
    name: CI required
    if: always()
    needs: [host, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every gate to pass
        env:
          HOST_RESULT: ${{ needs.host.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          test "$HOST_RESULT" = success
          test "$ANDROID_RESULT" = success
