version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    # Deliberate Android compatibility ceilings: upgrade only with focused evidence.
    ignore:
      - dependency-name: org.eclipse.jgit:org.eclipse.jgit
      - dependency-name: commons-io:commons-io
      - dependency-name: androidx.window:window
