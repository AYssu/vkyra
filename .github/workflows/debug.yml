name: Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build installable Debug APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          lfs: false
          persist-credentials: false
      - name: Restore bundled toolchain LFS objects
        id: lfs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .git/lfs/objects
          key: ${{ runner.os }}-${{ runner.arch }}-vkyra-lfs-v1-${{ hashFiles('app/src/**/assets/*.tar.xz', 'app/src/main/assets/demo.apk') }}
      - name: Materialize and verify LFS resources
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          git lfs pull
          git lfs fsck
      - name: Save verified toolchain LFS objects
        if: github.ref == 'refs/heads/main' && steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .git/lfs/objects
          key: ${{ steps.lfs-cache.outputs.cache-primary-key }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Locate SDK and cache generation
        id: sdk
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          # Preinstalled root-owned directories prevent tar restoring cache metadata.
          sudo chown -R "$(id -u):$(id -g)" "$sdk_root"
          {
            echo "root=$sdk_root"
            echo "epoch=$(date -u +%Y-%m)"
          } >> "$GITHUB_OUTPUT"
      - name: Restore Android build SDK
        id: sdk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.sdk.outputs.root }}/platform-tools
            ${{ steps.sdk.outputs.root }}/platforms/android-37.0
            ${{ steps.sdk.outputs.root }}/build-tools/36.0.0
            ${{ steps.sdk.outputs.root }}/ndk/28.2.13676358
            ${{ steps.sdk.outputs.root }}/licenses
          key: ${{ runner.os }}-${{ runner.arch }}-vkyra-sdk-v1-${{ steps.sdk.outputs.epoch }}-${{ hashFiles('scripts/ci/install-sdk.sh', 'gradle.properties') }}
      - name: Install the pinned Android SDK and NDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci/install-sdk.sh build
      - name: Save Android build SDK
        if: github.ref == 'refs/heads/main' && steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.sdk.outputs.root }}/platform-tools
            ${{ steps.sdk.outputs.root }}/platforms/android-37.0
            ${{ steps.sdk.outputs.root }}/build-tools/36.0.0
            ${{ steps.sdk.outputs.root }}/ndk/28.2.13676358
            ${{ steps.sdk.outputs.root }}/licenses
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}
      - name: Check source and build both Debug APKs
        run: |
          python3 scripts/ci/check-source.py
          ./gradlew :app:assembleAarch64Debug :app:assembleX86_64Debug --console=plain
      - name: Prepare APKs and checksums
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p build/debug-downloads
          for abi in aarch64 x86_64; do
            cp "app/build/outputs/apk/$abi/debug/app-$abi-debug.apk" \
              "build/debug-downloads/Vkyra-debug-$abi.apk"
          done
          printf '%s\n' "$BUILD_COMMIT" > build/debug-downloads/COMMIT.txt
          (cd build/debug-downloads && sha256sum ./*.apk > SHA256SUMS.txt)
          {
            echo '### Debug APK downloads'
            echo 'Download **vkyra-debug-apks** from the Artifacts section of this run.'
            echo '- aarch64: ARM64 Android phones/tablets'
            echo '- x86_64: compatible emulators/devices'
            echo '- Development certificate; an app signed with a different key cannot be updated in place.'
            echo "- Commit: $BUILD_COMMIT"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installable Debug APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vkyra-debug-apks
          path: build/debug-downloads/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
